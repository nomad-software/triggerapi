[package]
name = "triggerapi-core"
version.workspace = true
edition.workspace = true

[dependencies]
age = { version = "0.11", features = ["ssh", "armor"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
http = "1"
percent-encoding = "2"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
prost-types = "0.13"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-native-roots"] }
tonic-reflection = "0.12"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower-service = "0.3"
